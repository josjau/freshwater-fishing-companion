name: One-time Wave 4 closeout reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'tools/reconcile_wave4_closeout_once.js'
      - '.github/workflows/reconcile-wave4-closeout-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile Wave 4 and Fish Guide closeout
        run: node tools/reconcile_wave4_closeout_once.js
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs archive/workstreams/fish-guide
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "Close Wave 4 and Fish Guide Version 1"
          git push origin main
