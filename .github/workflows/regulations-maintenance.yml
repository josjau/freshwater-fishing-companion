name: Regulations Maintenance

on:
  workflow_dispatch:
  schedule:
    # Monthly report/alert cadence approved for Regulations external resources.
    - cron: "23 13 1 * *"

permissions:
  contents: read
  issues: write

jobs:
  regulations-maintenance:
    name: Validate freshness and review external resources
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository and Regulations freshness
        id: validation
        shell: bash
        run: |
          set +e
          node tools/validate_repository_integrity.js 2>&1 | tee regulations-validation.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check Regulations external references
        id: references
        run: node tools/check_external_references.js --regulations

      - name: Synchronize Regulations maintenance issue
        if: steps.validation.outputs.status != '0' || steps.references.outputs.concerns != '0'
        uses: actions/github-script@v7
        env:
          VALIDATION_STATUS: ${{ steps.validation.outputs.status }}
          REFERENCE_CONCERNS: ${{ steps.references.outputs.concerns }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Maintenance] Regulations resource review';
            const validation = fs.existsSync('regulations-validation.txt')
              ? fs.readFileSync('regulations-validation.txt', 'utf8')
              : 'Validation output was not available.';
            const references = fs.existsSync('regulations-maintenance-report.md')
              ? fs.readFileSync('regulations-maintenance-report.md', 'utf8')
              : 'External-reference report was not available.';
            const body = [
              '# Regulations maintenance review required',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Repository validation status: ${process.env.VALIDATION_STATUS}`,
              `External-reference concerns: ${process.env.REFERENCE_CONCERNS}`,
              '',
              'Automation is report-only. A human must verify authority, redirects, replacements, deactivation, notice status, and legal-resource meaning before changing source data.',
              '',
              '## External-reference report',
              '',
              references,
              '',
              '## Validation output',
              '',
              '```text',
              validation.slice(0, 30000),
              '```'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.notice(`Updated Regulations maintenance issue #${existing.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.notice(`Created Regulations maintenance issue #${created.number}.`);
            }

      - name: Confirm clean maintenance run
        if: steps.validation.outputs.status == '0' && steps.references.outputs.concerns == '0'
        run: echo "No Regulations maintenance concerns require issue synchronization."

      - name: Enforce deterministic freshness validation
        if: steps.validation.outputs.status != '0'
        run: |
          echo "Regulations deterministic validation failed. Review the maintenance issue and validation output."
          exit 1
