name: Apply Validator Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-validator-patch.yml

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Drive-derived validator patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/validate_repository_integrity.js';
          const source = fs.readFileSync(file, 'utf8');
          const startMarker = 'function validateDocumentationGovernance() {';
          const endMarker = 'function main() {';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('Could not locate validator documentation-governance function boundaries');
          }
          const replacement = Buffer.from('','base64').toString('utf8');
          const updated = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(file, updated, 'utf8');
          NODE
          node --check tools/validate_repository_integrity.js
          actual_hash="$(git hash-object tools/validate_repository_integrity.js)"
          expected_hash="bffd70392d780120a0a0afd3d8cbbdde607d5632"
          echo "validator blob: $actual_hash"
          test "$actual_hash" = "$expected_hash"
          node tools/validate_repository_integrity.js
      - name: Commit validator update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_repository_integrity.js
          git commit -m "Update repository integrity documentation checks"
          git push origin HEAD:main
