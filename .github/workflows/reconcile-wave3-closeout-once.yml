name: One-time Wave 3 documentation reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'tools/reconcile_wave3_closeout_once.js'
      - '.github/workflows/reconcile-wave3-closeout-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile Wave 3 documentation
        run: node tools/reconcile_wave3_closeout_once.js
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md docs/DECISIONS.md docs/DEVELOPMENT_WORKFLOW.md docs/FISH_REFERENCE_SOURCES.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "Finalize Wave 3 documentation consistency"
          git push origin main
