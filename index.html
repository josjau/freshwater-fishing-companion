<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Freshwater Fishing Companion</title>
    <link rel="stylesheet" href="forest-journal.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header__content">
            <h1>Freshwater Fishing Companion</h1>
            <p>Practical guidance for new freshwater anglers.</p>
        </div>
    </header>

    <main class="app-main" id="app-main">
        <section class="dashboard" aria-labelledby="dashboard-title">
            <h2 id="dashboard-title">Choose a Section</h2>

            <div class="dashboard-grid">
                <button class="dashboard-card dashboard-card--primary dashboard-card--home" type="button" data-route="regulations">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Regulations</span>
                        <span class="dashboard-card__action">Browse a State <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Find official state fishing regulations, licenses, access, and planning resources.</span>
                </button>

                <button class="dashboard-card dashboard-card--primary dashboard-card--home" type="button" data-route="fish">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Fish Guide</span>
                        <span class="dashboard-card__action">Browse Fish <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Learn to identify freshwater fish.</span>
                </button>

                <button class="dashboard-card dashboard-card--primary dashboard-card--home" type="button" data-route="knots">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Knots Guide</span>
                        <span class="dashboard-card__action">Browse Knots <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Learn reliable fishing knots.</span>
                </button>

                <button class="dashboard-card dashboard-card--primary dashboard-card--home" type="button" data-route="rigs">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Rigs Guide</span>
                        <span class="dashboard-card__action">Browse Rigs <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Build proven fishing rigs from verified references.</span>
                </button>

                <button class="dashboard-card dashboard-card--primary dashboard-card--home" type="button" data-route="tackle">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Tackle</span>
                        <span class="dashboard-card__action">Browse Tackle <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Learn about fishing tackle and manage the equipment you own.</span>
                </button>

                <button class="dashboard-card dashboard-card--home" type="button" data-route="recommendations">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">What Should I Throw?</span>
                        <span class="dashboard-card__action">Get Recommendations <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Get lure recommendations based on conditions.</span>
                </button>

                <button class="dashboard-card dashboard-card--home" type="button" data-route="catch-log">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Catch Log</span>
                        <span class="dashboard-card__action">View Catch Log <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Record catches, methods, and notes.</span>
                </button>

                <button class="dashboard-card dashboard-card--home" type="button" data-route="favorites">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Favorites</span>
                        <span class="dashboard-card__action">View Favorites <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Return to saved reference material.</span>
                </button>

                <button class="dashboard-card dashboard-card--home" type="button" data-route="settings">
                    <span class="dashboard-card__heading-row">
                        <span class="dashboard-card__title">Settings</span>
                        <span class="dashboard-card__action">Open Settings <span class="link-arrow link-arrow--internal" aria-hidden="true">→</span></span>
                    </span>
                    <span class="dashboard-card__description">Manage appearance, preferences, and backups.</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>Fish responsibly. Verify current regulations before harvesting.</p>
    </footer>

    <script src="data/fish-categories.js"></script>
    <script src="data/fish.js"></script>
    <script src="data/rigs.js"></script>
    <script src="data/conditions.js"></script>
    <script src="data/habitats.js"></script>
    <script src="data/fish-habitat.js"></script>
    <script src="data/environment-correspondence.js"></script>
    <script src="data/lure-bait.js"></script>
    <script src="data/techniques.js"></script>
    <script src="data/compatibility.js"></script>
    <script src="data/fish-identification.js"></script>
    <script src="data/fish-rig-guidance.js"></script>
    <script src="data/fish-specialized-guidance.js"></script>
    <script src="data/knots.js"></script>
    <script src="data/knot-guidance.js"></script>
    <script src="data/reel-guidance.js"></script>
    <script src="data/tackle.js"></script>
    <script src="data/canonical-requirement-satisfaction.js"></script>
    <script src="data/media.js"></script>
    <script src="data/regulations.js"></script>
    <script src="availability-quantity.js"></script>
    <script src="availability-attention.js"></script>
    <script src="my-tackle-reconciliation.js"></script>
    <script src="current-context-source-change.js"></script>
    <script src="recommendation-engine.js"></script>
    <script src="search.js"></script>
    <script src="view-renderer.js"></script>
    <script src="knot-media-renderer.js"></script>
    <script src="script.js"></script>
</body>
</html>
