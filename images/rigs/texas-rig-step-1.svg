<!--
FRESHWATER FISHING COMPANION
FILE: images/rigs/texas-rig-step-1.svg
REPLACEMENT: MS2.6 - TEXAS RIG TECHNICAL CORRECTION
PURPOSE: Shows the bullet weight correctly oriented on the main line before the hook is tied on.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Texas Rig Step 1</title>
  <desc id="desc">Slide the bullet weight onto the main line with the pointed end facing the rod side and the broad end facing the tag end where the hook will be tied.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b04b3f"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>

  <line x1="120" y1="180" x2="820" y2="180" stroke="#5d7f9c" stroke-width="6" stroke-linecap="round"/>
  <path d="M610 180 L552 135 Q528 146 518 180 Q528 214 552 225 Z" fill="#59636d" stroke="#1f2933" stroke-width="5" stroke-linejoin="round"/>
  <line x1="610" y1="180" x2="518" y2="180" stroke="#5d7f9c" stroke-width="4" stroke-linecap="round"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#263238">
    <text x="634" y="112" font-size="20" font-weight="600">Rod side</text>
    <text x="166" y="112" font-size="20" font-weight="600">Tag end for hook</text>
    <text x="449" y="278" font-size="18">Pointed end faces the rod</text>
  </g>
  <path d="M610 250 C628 230 640 210 638 190" fill="none" stroke="#b04b3f" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
