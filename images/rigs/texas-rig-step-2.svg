<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Texas Rig Step 2</title>
  <desc id="desc">The bullet weight sits on the main line with its broad end toward an offset worm hook tied at the tag end. The hook bend is below the future bait position and the point faces back toward the bait position.</desc>
  <rect width="920" height="360" fill="#ffffff"/>

  <line x1="820" y1="180" x2="510" y2="180" stroke="#5d7f9c" stroke-width="6" stroke-linecap="round"/>
  <path d="M650 180 L592 135 Q568 146 558 180 Q568 214 592 225 Z" fill="#59636d" stroke="#1f2933" stroke-width="5" stroke-linejoin="round"/>
  <line x1="650" y1="180" x2="558" y2="180" stroke="#5d7f9c" stroke-width="4" stroke-linecap="round"/>

  <circle cx="510" cy="180" r="10" fill="none" stroke="#1f2933" stroke-width="7"/>
  <path d="M501 181 L481 181 L470 196 L453 196 C438 196 429 208 429 220 C429 251 408 273 376 276 C340 279 312 258 314 228 C316 203 333 187 360 178" fill="none" stroke="#1f2933" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 178 L384 166 L375 191 Z" fill="#1f2933"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#263238">
    <text x="344" y="112" font-size="20" font-weight="600">Tie hook to line</text>
    <text x="259" y="318" font-size="18">Hook point faces back toward the bait position</text>
  </g>
  <g stroke="#7b8790" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M454 120 L493 163"/>
    <path d="M432 304 L376 276"/>
  </g>
</svg>
